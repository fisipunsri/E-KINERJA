    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            /* Ganti warna hex ini agar senada dengan warna dominan halaman login Anda */
            background-color: #1e3a8a; 
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            /* Iframe disembunyikan sampai konten siap */
            opacity: 0; 
            /* Efek muncul perlahan saat halaman sudah siap */
            transition: opacity 0.8s ease-in-out; 
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbxLF2dMVWfq0nVTNDrARKjKuptcGgbJHnfQz49tVXzm7W0YX9gqI_7woqWN8--ob5Xz/exec" 
        onload="this.style.opacity = '1';" 
        allowfullscreen>
    </iframe>

</body>
